[package]
name = "codetracer-miden-recorder"
version = "0.1.0"
edition = "2024"
authors = ["Metacraft Labs Ltd"]
description = "CodeTracer recorder for Miden VM programs (MASM and Rust-via-midenc)"
license = "Apache-2.0"

[dependencies]
# CodeTracer trace format
codetracer_trace_types = "0.16"
codetracer_trace_writer = "0.17"

# Miden VM
miden-processor = "0.14"
miden-assembly = "0.14"
miden-core = "0.14"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
eyre = "0.6"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
miden-testing = "0.14"
miden-protocol = { version = "0.14", features = ["testing"] }
tokio = { version = "1", features = ["rt", "macros"] }
