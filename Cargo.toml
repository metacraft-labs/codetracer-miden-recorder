[package]
name = "codetracer-miden-recorder"
version = "0.1.0"
edition = "2024"
authors = ["Metacraft Labs Ltd"]
description = "CodeTracer recorder for Miden VM programs (MASM and Rust-via-midenc)"
license = "Apache-2.0"

[dependencies]
# CodeTracer trace format
codetracer_trace_types = { path = "../codetracer-trace-format/codetracer_trace_types" }
codetracer_trace_writer_nim = { path = "../codetracer-trace-format/codetracer_trace_writer_nim" }

# Miden VM
miden-processor = "0.14"
miden-assembly = "0.14"
miden-core = "0.14"
# MASM standard library (provides `std::math::u64`, `std::sys`, etc.)
# so MASM sources can `use.std::*` and the assembler resolves stdlib
# procedures.  The recorder loads `StdLibrary::default()` into the
# assembler at trace time -- without this the assembler would error
# out on every `use.std::*` directive (see
# `stdlib_imports_test.masm`).
miden-stdlib = { version = "0.14", features = ["with-debug-info"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
eyre = "0.6"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
miden-testing = "0.14"
miden-protocol = { version = "0.14", features = ["testing"] }
tokio = { version = "1", features = ["rt", "macros"] }
# Used in falcon_signature_test_via_ct_print_full to construct
# a real Falcon signature against a fixed (PK, MSG) pair so the
# fixture's `# advice_map:` declaration carries a verifiable
# signature.  miden-stdlib exposes `falcon_sign` (the helper
# that encodes the signature in the format the in-VM verifier
# expects); miden-crypto exposes `SecretKey` for offline
# key generation.
miden-crypto = "0.14"
# Re-imported in tests to use the `falcon_sign` helper that
# encodes a Falcon signature in the format the in-VM verifier
# expects (challenge, expanded key polynomials, signature
# polynomial, product polynomial, nonce).
miden-stdlib = { version = "0.14", features = ["std"] }
