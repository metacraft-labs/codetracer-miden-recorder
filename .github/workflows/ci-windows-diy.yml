name: CI (windows-diy)

# Replays the project's Windows DIY dev env (env.ps1 + scoop/winget
# managed toolchain) through the shared `setup-dev-env` composite
# action's `windows-diy` flavor.  Runs alongside `ci.yml` (Linux
# `nix`) and `ci-reprobuild.yml` (multi-OS reprobuild) so all three
# dev-env paths gate merges — see
# `metacraft-dev-guidelines/policies/ci-shared-dev-env.md` §4
# (Migration story) for the rollout shape.
#
# The Windows DIY path is the developer-facing contract on Windows
# (`. .\env.ps1; just test`), so this workflow exists to catch
# Windows-only regressions that the Linux `nix` job can't surface
# and that the reprobuild path could silently hide under its own
# tool-provisioning code.

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  windows-diy:
    name: Windows DIY — just build/test
    # Private repos do not rely on GitHub-hosted Windows capacity. Use the
    # same self-hosted Windows label as the reprobuild lane so the job reaches
    # normal step logs instead of failing before runner assignment.
    runs-on: [self-hosted, Windows, X64, nixos-equivalent]
    env:
      NIM_WINDOWS_SOURCE_MODE: prebuilt
      WINDOWS_DIY_SETUP_NODE_DEPS: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env (windows-diy flavor)
        # setup-dev-env clones the siblings listed below at the
        # pinned revisions before materialising the env.
        # The recorder's env.ps1 dot-sources `../codetracer/env.ps1`
        # for the shared CodeTracer toolchain, so `codetracer` is added
        # to the common trace-format build set via an explicit
        # `siblings:` input. The trace-format pins match the nix/reprobuild
        # lanes so ct-print semantics stay consistent across OSes.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: windows-diy
          gh-token: ${{ steps.app-token.outputs.token }}
          siblings: |
            codetracer
            codetracer-trace-format=a3036ae7fc7dd20921a30ccfac255469f2ecf301
            codetracer-trace-format-nim=3c6278217f771f788fb2b01834d8d7484b195934

      - name: just build
        run: dev-exec just build

      - name: just test
        run: dev-exec just test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diy-logs
          path: |
            target/
            test-logs/
          retention-days: 7
          if-no-files-found: ignore
