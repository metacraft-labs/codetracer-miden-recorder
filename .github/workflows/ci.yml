name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - run: cargo check
      - run: cargo test
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - run: cargo clippy -- -D warnings
