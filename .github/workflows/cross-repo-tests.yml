# Cross-Repo Integration Tests
#
# Validates that changes to this recorder do not break the CodeTracer VS Code
# extension's MASM DAP and GUI tests.
#
# Workspace layout (sibling repos cloned alongside this checkout):
#   $GITHUB_WORKSPACE/../
#     codetracer-miden-recorder/                      <-- this repo (checked out)
#     codetracer/                    <-- cloned (for ct binary)
#     codetracer-vscode-extension/   <-- cloned (test harness + fixtures)
#     io-mon/                        <-- cloned (ct_test io_mon import)
#     nim-stackable-hooks/           <-- cloned (io-mon hook backend import)

name: Cross-Repo Integration Tests

on:
  pull_request:
    branches: [main, dev, stable]
  push:
    branches: [main, dev, stable]

  workflow_dispatch:
    inputs:
      codetracer_ref:
        description: 'Git ref for codetracer repo'
        required: false
        default: ''
      vscode_extension_ref:
        description: 'Git ref for codetracer-vscode-extension repo'
        required: false
        default: ''
      trace_format_ref:
        description: 'Git ref for codetracer-trace-format repo'
        required: false
        default: ''
      trace_format_nim_ref:
        description: 'Git ref for codetracer-trace-format-nim repo'
        required: false
        default: ''

  repository_dispatch:
    types: [cross-repo-test]

jobs:
  wdio-integration:
    runs-on: [self-hosted, nixos]

    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Configure NIX_CONFIG with access-tokens
        # The original top-level ``env: NIX_CONFIG`` block referenced
        # ``steps.app-token.outputs.token`` -- but the ``steps`` context
        # is unavailable at workflow level (the new GitHub Actions
        # validator rejects the file before any job starts).  Set
        # ``NIX_CONFIG`` via ``$GITHUB_ENV`` from a step that runs
        # AFTER ``app-token`` so subsequent ``nix develop`` invocations
        # can still fetch private flake inputs.
        run: |
          {
            echo 'NIX_CONFIG<<NIX_EOF'
            echo "access-tokens = github.com=${{ steps.app-token.outputs.token }}"
            echo 'accept-flake-config = true'
            echo 'NIX_EOF'
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dev env
        # Installs nix and clones the cross-repo siblings adjacent to this
        # checkout at workspace-lock-pinned revisions. workflow_dispatch /
        # repository_dispatch ref inputs override the locked revision for
        # codetracer + the extension. CodeTracer defaults to a known-good
        # published revision. Its db-backend uses the source-backed stream
        # reader APIs added after the CodeTracer flake lock's trace-format pin,
        # so the Rust trace-format default is pinned to the matching published
        # API commit; dispatch inputs may still override it for compatibility
        # testing.
        # nix-blockchain-development is cloned bare (no override) for the
        # recorder_exec mcl-blockchain flake override patched in below.
        # Keep these defaults together. Building CodeTracer d4179d7 against
        # the older a3036ae trace-format pin fails before the integration tests
        # can run because db-backend references the newer source-backed reader
        # surface.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
          siblings: |
            codetracer=${{ github.event.inputs.codetracer_ref || github.event.client_payload.codetracer_ref || 'd4179d7efc0d1fb5fd82b049843cab1ba435d4b7' }}
            codetracer-vscode-extension=${{ github.event.inputs.vscode_extension_ref || github.event.client_payload.vscode_extension_ref }}
            codetracer-trace-format=${{ github.event.inputs.trace_format_ref || github.event.client_payload.trace_format_ref || '9bdb07fa0a026e4494af60fbe9a45a8e4f1b3af3' }}
            codetracer-trace-format-nim=${{ github.event.inputs.trace_format_nim_ref || github.event.client_payload.trace_format_nim_ref || '839ed880c6340b9d1c4f81feb7f8e9e70b492956' }}
            io-mon=451eb2d664eb996b5a66815fd6decf7dae34be32
            nim-stackable-hooks=13eeb0a11a7a0d769d44cfd5bbce3644f2b067b9
            nix-blockchain-development

      - name: Provide CodeTracer CI-only sibling libs
        # The CodeTracer checkout doesn't ship all workspace siblings used by
        # this PR's pinned build. Copy the cloned siblings into paths under the
        # checkout so they are part of the Nix source tree passed to the
        # sandboxed build.
        run: |
          copy_sibling() {
            local name="$1"
            local src="$GITHUB_WORKSPACE/../$name"
            local dest="$GITHUB_WORKSPACE/../codetracer/libs/$name"
            rm -rf "$dest"
            cp -a "$src" "$dest"
          }

          copy_sibling codetracer-trace-format
          copy_sibling io-mon
          copy_sibling nim-stackable-hooks

      - name: Patch codetracer Nix ct_test sibling paths
        # The pinned codetracer package builds ``src/ct/codetracer.nim`` as the
        # main module, so ``src/ct_test/config.nims`` is not loaded early enough
        # to add the seekable-reader and io-mon package paths used by the
        # ct_test imports.
        # Patch the cloned checkout before ``nix build`` so the flake override
        # for codetracer-trace-format-nim and the copied workspace siblings
        # reach the Nim compiler directly.
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer"
          while IFS= read -r line || [ -n "$line" ]; do
            printf '%s\n' "$line"
            if [ "$line" = "            pkgs.libbpf" ]; then
              printf '%s\n' "            pkgs.zstd"
            fi
          done < nix/packages/default.nix > nix/packages/default.nix.tmp
          mv nix/packages/default.nix.tmp nix/packages/default.nix
          while IFS= read -r line || [ -n "$line" ]; do
            printf '%s\n' "$line"
            if [ "$line" = "              --mm:refc --hints:off --warnings:off \\" ]; then
              printf '%s\n' '              --path:"${inputs.codetracer-trace-format-nim}/src" \'
              printf '%s\n' '              --path:"./libs/nim-stew/stew" \'
              printf '%s\n' '              --path:"./libs/io-mon/src" \'
              printf '%s\n' '              --path:"./libs/nim-stackable-hooks/src" \'
              printf '%s\n' '              --passC:"-I${pkgs.zstd.dev}/include" \'
              printf '%s\n' '              --passL:"-L${pkgs.zstd}/lib" \'
            fi
          done < nix/packages/default.nix > nix/packages/default.nix.tmp
          mv nix/packages/default.nix.tmp nix/packages/default.nix
          line_no=0
          while IFS= read -r line || [ -n "$line" ]; do
            line_no=$((line_no + 1))
            case "$line" in
              *codetracer-trace-format-nim*|*pkgs.zstd*|*libs/nim-stew/stew*|*libs/io-mon/src*|*libs/nim-stackable-hooks/src*)
                printf '%s:%s\n' "$line_no" "$line"
                ;;
            esac
          done < nix/packages/default.nix

      - name: Build codetracer
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer"
          OVERRIDE="--override-input codetracer-trace-format path:./libs/codetracer-trace-format --override-input codetracer-trace-format-nim path:../codetracer-trace-format-nim"
          # ``cache.metacraft-labs.com/metacraft-codetracer`` serves a stale
          # narinfo for the noir flake input keyed under a NAR-hash
          # that no longer matches the lockfile, so the build aborts
          # with ``NAR hash mismatch in input git+https://...noir...``.
          # Force-skip every non-default substituter (``cache.nixos.org``
          # alone is plenty for the standard nixpkgs paths) so nix
          # fetches the noir source from origin and computes the
          # correct hash itself.  Documented as CI-stabilization §4.
          SUBST_OVERRIDE="--option accept-flake-config false --option substituters https://cache.nixos.org"
          # The runner's per-user fetcher cache
          # (~/.cache/nix/fetcher-cache-v2.sqlite) holds a stale
          # narinfo for the noir git+https input that contradicts the
          # lockfile.  ``--refresh`` forces nix to re-resolve every
          # flake input from origin even when the local cache has an
          # entry, so the cached narHash gets replaced by what
          # upstream currently serves.
          REFRESH="--refresh"
          nix build $SUBST_OVERRIDE $REFRESH -L ".?submodules=1#codetracer" $OVERRIDE -o result-ct
          nix build $SUBST_OVERRIDE -L ".?submodules=1#db-backend" $OVERRIDE -o result-db
          # Merge both outputs into a single bin directory so the extension
          # can find both ct and db-backend via a single runnablePath.
          mkdir -p combined-bin
          ln -sf "$PWD"/result-ct/bin/* combined-bin/
          ln -sf "$PWD"/result-db/bin/* combined-bin/
          echo "$PWD/combined-bin" >> "$GITHUB_PATH"

      - name: Install extension dependencies
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          nix develop -c just install

      - name: Compile extension TypeScript
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          nix develop -c just compile-ts

      - name: Restore Nim-compiled ct_vscode.js
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          if [ -f media/ct_vscode.js ]; then
            cp media/ct_vscode.js out/ct_vscode.js
          fi

      - name: Patch recorder_exec for local flake override
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          MCL_PATH="$GITHUB_WORKSPACE/../nix-blockchain-development"
          # Replace recorder_exec to bypass direnv (which can't propagate
          # GitHub auth to the NixOS Nix daemon) and use --override-input
          # to resolve mcl-blockchain from the local clone.
          cat > scripts/recorder-shell-exec.sh << HEREDOC
          #!/usr/bin/env bash
          recorder_exec() {
            local repo_dir="\$1"
            shift
            if [ -f "\$repo_dir/flake.nix" ] && command -v nix >/dev/null 2>&1; then
              nix develop "\$repo_dir" --accept-flake-config \\
                --override-input mcl-blockchain "path:$MCL_PATH" \\
                -c "\$@"
            else
              "\$@"
            fi
          }
          HEREDOC

      - name: Patch runnablePath for CI
        run: |
          CT_BIN="$GITHUB_WORKSPACE/../codetracer/combined-bin/ct"
          SETTINGS="$GITHUB_WORKSPACE/../codetracer-vscode-extension/test/wdio/projects/stylus-test/.vscode/settings.json"
          mkdir -p "$(dirname "$SETTINGS")"
          echo "{\"codetracer.runnablePath\": \"$CT_BIN\"}" > "$SETTINGS"
          echo "Patched runnablePath to: $CT_BIN"

      - name: Record MASM trace fixture
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/../codetracer-miden-recorder/target"
          FORCE=1 bash scripts/prepare-masm-fixture.sh

      - name: Run MASM smoke tests
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          nix develop -c just _xvfb-run \
            "npx wdio run wdio.conf.ts --spec test/wdio/specs/smoke/masm.e2e.ts"

      - name: Run MASM deep tests
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          nix develop -c just _xvfb-run \
            "npx wdio run wdio.conf.ts --spec test/wdio/specs/deep/masm-deep.e2e.ts"

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          EXT_DIAG="$GITHUB_WORKSPACE/../codetracer-vscode-extension/test/wdio/diagnostics"
          if [ -d "$EXT_DIAG" ]; then
            mkdir -p "$GITHUB_WORKSPACE/wdio-diagnostics"
            shopt -s nullglob
            files=("$EXT_DIAG"/*)
            if [ "${#files[@]}" -gt 0 ]; then
              cp -r "${files[@]}" "$GITHUB_WORKSPACE/wdio-diagnostics/"
            fi
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-masm-diagnostics
          path: wdio-diagnostics/
          retention-days: 7
          if-no-files-found: ignore
